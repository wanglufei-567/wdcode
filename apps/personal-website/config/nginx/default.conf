server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/note-content/(?:.*/)?\.[^/]+(?:/|$) {
        return 404;
    }

    location ~ ^/note-content/(?<note_file>.+\.md)$ {
        alias /srv/notes/$note_file;
        default_type text/markdown;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location /note-content/ {
        alias /srv/notes/;
        autoindex on;
        autoindex_format json;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
