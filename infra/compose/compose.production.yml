name: wdcode

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      personal-web:
        condition: service_healthy
      fund-web:
        condition: service_healthy
      fund-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web

  personal-web:
    build:
      context: ../../apps/personal-website
    image: ${PERSONAL_WEB_IMAGE:-wdcode/personal-web:local}
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ${DEBRIS_RECORD_PATH:?DEBRIS_RECORD_PATH is required}:/srv/notes:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web

  fund-web:
    image: ${FUND_WEB_IMAGE:?FUND_WEB_IMAGE is required}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web

  fund-api:
    image: ${FUND_API_IMAGE:?FUND_API_IMAGE is required}
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "5174"
      STORE_PATH: /app/data/store.json
    expose:
      - "5174"
    volumes:
      - ${FUND_DATA_PATH:?FUND_DATA_PATH is required}:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5174/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
